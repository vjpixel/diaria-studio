name = "onboarding-form"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

# #10605 — formulário de perfil/interesses do onboarding (decisão do editor,
# 20/10/2026: form próprio num Worker nosso). Publicado em formulario.diar.ia.br
# (22/10/2026), deploy automático via .github/workflows/deploy-onboarding-form.yml (#5337).
# Contrato (endpoints, formato, gravação no store): scripts/lib/onboarding-form-contract.ts.
#
# Como foi publicado (referência pra recriar):
#   1. wrangler kv namespace create ONBOARDING_FORM
#   2. Declarar o binding com o id do passo 1 (abaixo)
#   3. wrangler secret put RESPONSES_TOKEN (mesmo valor de ONBOARDING_FORM_TOKEN no .env do servidor)
#   3b. wrangler secret put ONBOARDING_FORM_LINK_SECRET (#10657 — mesmo valor
#       da var de mesmo nome no .env/Doppler do executor; sem ele toda rota
#       responde 503 "not_configured") + custom field `form_sig` criado no Kit
#   4. Rota/domínio + onboarding.followup.form_url/form_responses_url no platform.config.json
# Sem o binding o Worker responde 503 "not_configured" — nunca lança.
#
# 22/10/2026: passos 1-4 feitos (KV criado, secrets RESPONSES_TOKEN e
# ONBOARDING_FORM_LINK_SECRET no Worker, form_sig no Kit, rota abaixo).
# workers_dev = true continua ativo como fallback.

[[routes]]
pattern = "formulario.diar.ia.br"
custom_domain = true

[[kv_namespaces]]
binding = "ONBOARDING_FORM"
id = "b40a817cabd547f68a360300a3f41f39"

[observability]
enabled = true
