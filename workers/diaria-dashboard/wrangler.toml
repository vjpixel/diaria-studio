name = "diaria-dashboard"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

# Dados vêm de KV populado offline pelo editor — o script
# build-diaria-dashboard-data.ts --push faz o push pro KV.
#
# Secrets (via `wrangler secret put`):
#   AUTH_TOKEN  → token compartilhado que protege TODO o Worker (#5133 —
#                 achado de segurança: o dashboard servia HTML + JSON
#                 operacional sem NENHUMA autenticação). Ausente = fail-
#                 CLOSED (nega acesso a todo mundo, nunca libera). Mesmo
#                 padrão de workers/brevo-dashboard (#2748/#3081).
#                 Gerar: openssl rand -hex 32
#                 Setup: wrangler secret put AUTH_TOKEN
#
# Dashboard protegido por header X-Dashboard-Token OU cookie de sessão —
# ver docs/diaria-dashboard-access-setup.md.

# KV namespace para o JSON de dados agregados.
# Namespace DASHBOARD_DATA criado em 2026-06-12 (overnight 260612, deploy do #2132).
[[kv_namespaces]]
binding = "DASHBOARD_DATA"
id = "4610c3016818483cab141f459a963de3"
preview_id = "4610c3016818483cab141f459a963de3"

# Build step: gera ds-tokens.generated.ts a partir da fonte canônica do DS.
# Mesmo padrão do brevo-dashboard (#2107).
[build]
command = "npx tsx ../../scripts/generate-worker-tokens.ts --out-dir workers/diaria-dashboard/src"
