# workers/cursos — hosting da página "Cursos sobre IA" (#1745, gate #4052).
#
# #4052: convertido de static-assets-only pra worker com SCRIPT
# (`main = src/index.ts`) + assets. `env.ASSETS` continua servindo
# `workers/cursos/public/index.html` (teaser — floor(20%×total) cursos
# abertos, os demais AUSENTES do render, nem título; ver #4305) como
# fallback; o script intercepta `/`, `/index.html`, `/gate`, `/gate/verify`,
# `/gate/subscribe` pra decidir teaser × conteúdo completo (ver src/index.ts).
# O HTML teaser é gerado por `scripts/build-cursos-page.ts` a partir de
# `seed/courses/cursos-ia.json` (fonte de verdade, versionada); o HTML
# completo (servido só depois do gate passar) é gerado no MESMO comando pra
# `src/courses-full.generated.ts` (committed, nunca fetchable como asset
# estático). REGENERAR antes do deploy quando o seed mudar:
#
#   npx tsx scripts/build-cursos-page.ts --out workers/cursos/public/index.html --gen-full workers/cursos/src/courses-full.generated.ts
#   cd workers/cursos && npx wrangler deploy
#
# Os testes `test/cursos-asset-drift.test.ts` e `test/cursos-full-drift.test.ts`
# garantem que os dois HTMLs committed refletem o seed (CI falha no drift).
#
# SETUP MANUAL antes do 1º deploy (ver PR #4052 pro passo-a-passo completo):
#   1. wrangler kv namespace create CURSOS_SUBSCRIBERS  → colar o id abaixo
#   2. wrangler secret put COOKIE_HMAC_SECRET   (gerar: openssl rand -hex 32)
#   3. wrangler secret put BEEHIIV_API_KEY          (opcional — ver gate.ts)
#   4. wrangler secret put BEEHIIV_PUBLICATION_ID   (opcional — ver gate.ts)
#   5. Rodar scripts/sync-cursos-subscribers-kv.ts pra popular o KV pela 1ª vez
#      (#4320: já agendado depois disso via systemd — task
#      "Diaria-Cursos-Kv-Sync", diária 09:15 — e o alarme de erro do worker
#      via task "Diaria-Cursos-Error-Alarm", a cada 2h)
name = "cursos"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# #3698: domínio de marca (cursos.diar.ia.br). workers_dev = true continua
# ativo — links já enviados em edições passadas apontam pra
# cursos.diaria.workers.dev e precisam continuar vivos.
[[routes]]
pattern = "cursos.diar.ia.br"
custom_domain = true

# #4305: sem isto o `console.error` do worker só existe enquanto alguém está
# com `wrangler tail` aberto — e o fail-soft de `handleIndex` responde 200,
# então some também do gráfico de erro nativo do Cloudflare, que é o sinal
# ambiente que um 500 daria de graça. Falha persistente (secret rotacionado,
# KV apontando pro namespace errado) ficaria invisível pra sempre: todo
# visitante veria o teaser e ninguém saberia. Workers Logs é opt-in de config
# e entra no free tier.
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# INVARIANTE (#4052 follow-up): Workers com Static Assets servem o ASSET
# ANTES de invocar o script — se existe arquivo casando com o path, o
# `fetch` handler NUNCA roda. `public/index.html` casa com `/`, então o
# gate inteiro ficava morto em produção: `?email=` da newsletter (caminho A)
# era ignorado e o cookie de sessão nunca era lido (caminho B desbloqueava,
# setava o cookie e a página seguia teaser). Só `/gate*` funcionava, porque
# não tem asset correspondente. `run_worker_first` força o script a decidir
# em `/` (e em `/index.html`, o MESMO asset por outro path) — o teaser
# continua vindo do ASSETS binding, mas só depois de `handleIndex` checar
# `?email=`/cookie.
#
# #5104 (fleet review do #5097/#5099): mudou de lista (`["/", "/index.html"]`)
# pra `true` (cobertura total, mesmo padrão de `workers/livros/wrangler.toml`).
# Motivo: `public/robots.txt`/`public/sitemap.xml` também são assets estáticos
# — sem o script rodar pra eles, o redirect `.workers.dev`→canônico
# (`resolveWorkersDevRedirect`, chamado no topo do `fetch` handler) nunca é
# consultado nesses 2 paths, e `cursos.diaria.workers.dev/robots.txt`/
# `/sitemap.xml` continuam 200 pra sempre — exatamente o vazamento que o
# redirect existe pra fechar. A lista antiga precisava casar 1:1 com
# `GATED_INDEX_PATHS` em `src/index.ts` (travado por
# `test/cursos-worker-first.test.ts`); `true` dispensa essa sincronia — o
# script roda pra TODO path, e `GATED_INDEX_PATHS` continua controlando só
# quais paths passam pelo gate (`/`, `/index.html`); os demais (`/robots.txt`,
# `/sitemap.xml`, `/gate*`) já caem no fallback `env.ASSETS.fetch`/rota
# própria no fim do `fetch` handler, sem gate nenhum — comportamento
# inalterado pra eles, só ganham o redirect check antes.
run_worker_first = true

# #4052: KV do sync de assinantes ativos (subscriber:{sha256(email)}), fonte
# PRIMÁRIA de verificação (scripts/sync-cursos-subscribers-kv.ts popula).
# PLACEHOLDER — rodar `wrangler kv namespace create CURSOS_SUBSCRIBERS` e
# colar o id retornado aqui antes do deploy.
[[kv_namespaces]]
binding = "CURSOS_SUBSCRIBERS"
id = "a3415c3bf4b840d6975dbac290b99153"

[vars]
# #6048 (item 2/5 do checklist de migração Kit) — nome do custom field Kit
# que recebe o marcador "entrou pelo funil" (KIT_NATIVE_SIGNUP_MARKER, ver
# scripts/lib/shared/kit-signup-origin.ts). VAR, não secret — nome de custom
# field não é sensível (mesmo tratamento dos demais KIT_*_FIELD, ver
# workers/poll/SECRETS.md). Custom field já existe na conta Kit de produção
# (id 1348066). Ativo neste worker desde SUBSCRIBE_BACKEND = "kit" abaixo
# (#6048 item 4/5).
KIT_ORIGEM_CADASTRO_FIELD = "origem_cadastro"

# #6318 — nomes dos custom fields Kit que recebem a atribuição do cadastro.
# Sem estas vars o worker calcula o triplo UTM corretamente e o DESCARTA
# (o gate-por-ausência em subscribeToKit só anexa `fields` para as chaves
# configuradas) — foi exatamente o que aconteceu entre 25/08 e 26/08: toda a
# base nova entrou no Kit sem origem nenhuma. Os 4 campos já existem na conta
# de produção (criados 26/08). VARs, não secrets — nome de custom field não é
# sensível, mesmo tratamento de KIT_ORIGEM_CADASTRO_FIELD acima.
KIT_UTM_SOURCE_FIELD = "utm_source"
KIT_UTM_MEDIUM_FIELD = "utm_medium"
KIT_UTM_CAMPAIGN_FIELD = "utm_campaign"
KIT_REFERRING_SITE_FIELD = "referring_site"

# #7535 (Camada 1) — mesmo custom field de produção usado pelo worker `poll`
# (id 1358403, key "origem_paga") pra gravar o canal pago do cliente que
# chegou ao gate de cursos via querystring, sem tocar no triplo fixo acima.
KIT_ORIGEM_PAGA_FIELD = "origem_paga"

# #8003: campos Kit criados via REST direto (12/09/2026 — o 401 anterior era
# formato de header errado, não plano gated; `X-Kit-Api-Key` funcionou de
# primeira) — id 1364225 "origem_referrer", id 1364226 "origem_click_id".
# BEEHIIV_ORIGEM_REFERRER_FIELD/BEEHIIV_ORIGEM_CLICKID_FIELD (código em
# subscribe.ts) seguem SEM var — backend ativo é Kit (SUBSCRIBE_BACKEND
# abaixo), nenhum campo Beehiiv está configurado neste worker hoje.
KIT_ORIGEM_REFERRER_FIELD = "origem_referrer"
KIT_ORIGEM_CLICKID_FIELD = "origem_click_id"

# #6048 (item 4/5, Gate B aprovado pelo editor 25/08/2026 — rollout worker-a-
# worker, poll já verificado ao vivo, cursos é o 2º). env.SUBSCRIBE_BACKEND
# === "kit" em workers/cursos/src/subscribe.ts — cadastro pelo gate de cursos
# passa a ir pro Kit em vez da Beehiiv. (A frase seguinte dizia "reativar
# segue em Beehiiv até verificação ao vivo deste worker" — desatualizada:
# workers/reativar/wrangler.toml já fixa SUBSCRIBE_BACKEND = "kit", os 3
# workers migraram. Corrigido em 09/09/2026, #7723.)
SUBSCRIBE_BACKEND = "kit"

# #7723 (09/09/2026, "habilita DOI em todos os lugares") — designer form
# "Cadastro DOI (confirmacao)" do Kit, o MESMO usado pelo worker `poll`.
# Criar o assinante `inactive` e VINCULAR a este form e o que dispara o
# e-mail de confirmacao; sem o vinculo, `inactive` e uma prisao (nada promove
# inactive->active sozinho).
#
# NAO apontar para 9839463 ("Newsletter site"): e form de SISTEMA, sem o
# toggle "Send confirmation email" — o vinculo responde 201 e nada e enviado.
# `verificarDoiForm` (scripts/lib/shared/kit-doi.ts) recusa ids de sistema e
# faz o cadastro nascer "active", de proposito.
#
# VAR, nao secret — id de form nao e sensivel. Precisa andar junto com
# platform.config.json -> kit.doiFormId.
KIT_DOI_FORM_ID = "9897918"
