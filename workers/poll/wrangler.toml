name = "poll"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# #3701: domínio de marca pro jogo público "É IA?" (eia.diar.ia.br → /jogar).
# workers_dev = true continua ativo — links de voto/img/stats de edições já
# enviadas apontam pra poll.diaria.workers.dev e precisam continuar vivos.
[[routes]]
pattern = "eia.diar.ia.br"
custom_domain = true

[[kv_namespaces]]
binding = "POLL"
id = "72784da4ae39444481eb422ebac357c6"

# #4054: `SUBSCRIBERS_KV` (verificação primária de assinante ativo pro gate
# de `/jogar`, ver web-gate.ts) é OPCIONAL DE PROPÓSITO e NÃO está declarado
# aqui — diferente de `CURSOS_SUBSCRIBERS` em workers/cursos/wrangler.toml
# (#4052). Motivo: `workers/poll` tem deploy AUTOMÁTICO em todo merge pra
# master que tocar `workers/poll/**` (.github/workflows/deploy-poll.yml,
# #3399) — um `[[kv_namespaces]]` com id placeholder aqui quebraria esse
# deploy (wrangler valida o id no `deploy`, não só documenta a intenção).
# `checkWebSubscriber` (web-gate.ts) já trata o binding ausente com graça
# (cai pro fallback Beehiiv `by_email`, ou "não verificado" sem os dois — o
# form de cadastro inline cobre esse caso, nunca quebra o gate). Pra ativar a
# verificação primária por KV: rodar `wrangler kv namespace create
# SUBSCRIBERS_KV`, adicionar o bloco `[[kv_namespaces]]` manualmente aqui com
# o id retornado, E só então mergear/deployar — ver SECRETS.md.

# #2187: Durable Object para serialização de dedup de voto por email.
# Elimina a race read-modify-write que o KV eventual-consistent expunha.
# Classe `VoteDedup` exportada de src/vote-dedup.ts (re-exportada por index.ts).
[[durable_objects.bindings]]
name = "VOTE_DEDUP"
class_name = "VoteDedup"

# #2223: Durable Object para serialização do contador stats edition-wide.
# Elimina a race read-modify-write em stats:{edition} — sob burst, requests
# concorrentes perdiam incrementos ao ler o mesmo valor stale no KV.
# Instanciado por {brand}:{edition} — brand incluído para isolamento diaria×clarice.
# Classe `StatsCounter` exportada de src/stats-counter.ts (re-exportada por index.ts).
[[durable_objects.bindings]]
name = "STATS_COUNTER"
class_name = "StatsCounter"

# #4169: Durable Object para serialização do read-modify-write de
# score:{email} (global) e score-by-month:{month}:{email} (mensal). Elimina a
# race que o #4168 (releitura fresca de score:{email}) só ESTREITOU sem
# eliminar — dois runVoteBookkeeping concorrentes do MESMO email (edições
# diferentes) podiam intercalar entre o get e o put, perdendo um incremento.
# Instanciado por {brand}:{email} — brand incluído para isolamento diaria×clarice×web.
# Classe `ScoreCounter` exportada de src/score-counter.ts (re-exportada por index.ts).
[[durable_objects.bindings]]
name = "SCORE_COUNTER"
class_name = "ScoreCounter"

# Migration obrigatória para new_sqlite_classes (#2187, #2236).
# Ao deploying pela primeira vez: wrangler deploy cria os namespaces DO
# automaticamente. Não é necessário nenhuma ação manual além do deploy.
# NÃO deployar sem esta migration — a ausência dela causaria erro 1102 do CF
# ("No such binding" para DurableObjectNamespace) ao tentar usar o namespace.
[[migrations]]
tag = "v1-vote-dedup"
# Free plan do Cloudflare exige DO com storage SQLite (new_sqlite_classes),
# não new_classes (KV-backed, só plano pago) — erro 10097 no deploy. O
# state.storage API é idêntico; nenhuma mudança de código no DO (#2236).
new_sqlite_classes = ["VoteDedup"]

# Migration para StatsCounter (#2223). Tag separada de v1 — migration tags são
# cumulativas no CF; nova tag cobre apenas a classe nova. NÃO deployar sem isto.
[[migrations]]
tag = "v2-stats-counter"
new_sqlite_classes = ["StatsCounter"]

# Migration para ScoreCounter (#4169). Tag separada de v1/v2 — migration tags
# são cumulativas no CF; nova tag cobre apenas a classe nova. NÃO deployar sem isto.
[[migrations]]
tag = "v3-score-counter"
new_sqlite_classes = ["ScoreCounter"]

# Nota (#2187 finding #3): não há seção [env.staging] neste wrangler.toml.
# O projeto poll não usa um ambiente staging separado — testes de integração
# rodam via miniflare/Node (sem binding DO real). Se um env staging for
# adicionado no futuro, DEVE incluir o binding VOTE_DEDUP e a [[migrations]]
# abaixo, caso contrário `wrangler deploy --env staging` omitirá o binding
# silenciosamente e cairá no path KV racy (race condition do #2187).
# NÃO deployar sem esse bloco em qualquer env que use VOTE_DEDUP.

[vars]
# #4051: livros.diar.ia.br adicionado — CTA inline de assinatura na página de
# livros chama POST /jogar/subscribe cross-origin (worker diferente). Entrada
# explícita, nunca "*" (mesma convenção de EMBED_ALLOWED_ORIGINS abaixo).
# #5167 itens 1/2: arquivo.diar.ia.br adicionado pelo mesmo motivo — CTA
# inline no topo da página de arquivo e de cada hub temático (mesmo Worker
# `arquivo`, mesmo host) chama POST /jogar/subscribe cross-origin.
ALLOWED_ORIGINS = "https://diar.ia.br,https://diaria.beehiiv.com,https://livros.diar.ia.br,https://arquivo.diar.ia.br"

# #6048 (item 2/5 do checklist de migração Kit) — nome do custom field Kit
# que recebe o marcador "entrou pelo funil" (KIT_NATIVE_SIGNUP_MARKER, ver
# scripts/lib/shared/kit-signup-origin.ts). VAR, não secret — nome de custom
# field não é sensível (mesmo tratamento dos demais KIT_*_FIELD, ver
# SECRETS.md). Custom field já existe na conta Kit de produção (id 1348066).
# Ativo neste worker desde SUBSCRIBE_BACKEND = "kit" abaixo (#6048 item 4/5).
KIT_ORIGEM_CADASTRO_FIELD = "origem_cadastro"

# #6318 — nomes dos custom fields Kit que recebem a atribuição do cadastro.
# Sem estas vars o worker calcula o triplo UTM corretamente e o DESCARTA
# (o gate-por-ausência em subscribeToKit só anexa `fields` para as chaves
# configuradas) — foi exatamente o que aconteceu entre 25/08 e 26/08: toda a
# base nova entrou no Kit sem origem nenhuma. Os 4 campos já existem na conta
# de produção (criados 26/08). VARs, não secrets — nome de custom field não é
# sensível, mesmo tratamento de KIT_ORIGEM_CADASTRO_FIELD acima.
KIT_UTM_SOURCE_FIELD = "utm_source"
KIT_UTM_MEDIUM_FIELD = "utm_medium"
KIT_UTM_CAMPAIGN_FIELD = "utm_campaign"
KIT_REFERRING_SITE_FIELD = "referring_site"

# #6048 (item 4/5, Gate B aprovado pelo editor 25/08/2026 — rollout worker-a-
# worker, poll primeiro por ser o de menor volume). env.SUBSCRIBE_BACKEND ===
# "kit" em workers/poll/src/subscribe.ts (linha ~579) — cadastro via "É IA?"
# passa a ir pro Kit em vez da Beehiiv. cursos/reativar seguem em Beehiiv até
# verificação ao vivo deste worker confirmar o funil Kit ponta a ponta.
SUBSCRIBE_BACKEND = "kit"

# #3521: allowlist de origens autorizadas a embutir GET /embed dentro de um
# <iframe> (CSP frame-ancestors, ver workers/poll/src/embed.ts). VAZIO =
# ninguém autorizado (fail-closed) — configurar aqui quando o 1º parceiro
# (Clarice.ai, sugestão do EPIC #3514) for ativado, com a origem HTTPS
# completa do site dele (ex: "https://clarice.ai"). Formato: mesma convenção
# CSV de ALLOWED_ORIGINS acima. NUNCA usar "*" aqui — abriria o widget pra
# QUALQUER site embutir (superfície de clickjacking), contrário ao mandato
# explícito da issue #3521 ("não abrir iframe pro mundo").
EMBED_ALLOWED_ORIGINS = ""

# #1077 superseded por #1345: cron de reset removido. Leaderboard agora é
# indexado por publication date (score-by-month:{YYYY-MM}:{email}); reset
# não é mais necessário — meses são naturalmente isolados.

# Build step (#3111, mesmo padrão do brevo-dashboard #2107): gera
# ds-tokens.generated.ts a partir de scripts/lib/shared/design-tokens.ts antes
# de compilar o Worker. Antes disto, index.ts/leaderboard-routes.ts duplicavam
# os valores de cor/fonte do DS inline (comentários "#1936 DS canônico") sem
# trava contra divergência futura — ver test/poll-ds-tokens.test.ts.
[build]
command = "npx tsx ../../scripts/generate-worker-tokens.ts --out-dir workers/poll/src"

# #5920: Workers Logs ligado — eia.diar.ia.br recebe 1.2k+ req/dia e precisa
# de referrer/erro observáveis sem depender de `wrangler tail` aberto.
[observability]
enabled = true
head_sampling_rate = 1
