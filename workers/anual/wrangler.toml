name = "anual"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# #7581: hosting da retrospectiva anual pública com gate de CADASTRO (não
# apoio, decisão do editor 07/09/2026 — comentário-marcador da issue).
# Domínio de marca dedicado — mesmo mecanismo comprovado de
# cursos.diar.ia.br / livros.diar.ia.br / eia.diar.ia.br / artigo.diar.ia.br
# (custom_domain, NÃO a rota clássica na raiz).
[[routes]]
pattern = "anual.diar.ia.br"
custom_domain = true

# KV namespace com o HTML JÁ RENDERIZADO da retrospectiva anual, por slug
# (key `article:{slug}` completo, `article:{slug}:teaser` trecho — ex:
# `article:2026-aniversario`). Escrito por `scripts/build-annual-page.ts --push`
# (Node-side; o Worker NUNCA renderiza markdown — só serve o HTML pronto).
#
# Namespace criado em 08/09/2026 (rodada overnight 260907b) com o título
# "ANUAL_ARTICLES" (não "ARTICLES" — esse título já pertence ao namespace
# do worker artigo-mensal; títulos de KV são globais na conta Cloudflare,
# reusar teria colidido as duas chaves `article:{slug}` no mesmo balde). O
# binding local segue "ARTICLES" — só o título de criação mudou.
[[kv_namespaces]]
binding = "ARTICLES"
id = "bcdffe6c2daf452d95824429231f9dd3"

# KV namespace do rate-limit por IP do gate (`checkKvRateLimit`,
# scripts/lib/shared/rate-limit.ts) — mesmo padrão de `workers/poll`
# (binding `POLL`, reusado como namespace de rate-limit genérico lá).
#
# Namespace criado em 08/09/2026 (rodada overnight 260907b), título
# "ANUAL_RATE_LIMIT" (mesmo racional de nomeação do ARTICLES acima).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "132c0969a2cf4dfda0a9e7fb511695a4"

# #5920: Workers Logs ligado para observabilidade de erro (fail-closed do gate).
[observability]
enabled = true
head_sampling_rate = 1

# KIT_API_KEY é SECRET (não var) — setar via:
#   cd workers/anual && npx wrangler secret put KIT_API_KEY
# Mesma key já usada pelo worker `poll` (verificação Kit, #6048) e por
# `scripts/lib/kit-client.ts` (Node-side) — não é uma key nova a gerar.
