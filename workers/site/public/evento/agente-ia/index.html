<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151310" />
    <meta name="description" content="Em uma tarde, online e ao vivo, crie seu primeiro agente de IA sem escrever código. Sábado, 10 de outubro de 2026, das 14h às 18h." />
    <title>Crie seu primeiro agente de IA sem programar</title>
    <!-- Teste A/B: sorteia a versão uma vez por visitante (fica guardada no
         navegador) e leva junto a query string, para as UTMs e o fbclid
         chegarem à página e ao checkout. Sem pixel aqui: o PageView é da
         versão que abrir. -->
    <script>
      (function () {
        var key = "evento-agente-ia-variante", v;
        try { v = localStorage.getItem(key); } catch (e) {}
        if (v !== "a" && v !== "b") {
          v = Math.random() < 0.5 ? "a" : "b";
          try { localStorage.setItem(key, v); } catch (e) {}
        }
        location.replace("/evento/agente-ia/" + v + location.search + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/evento/agente-ia/a" /></noscript>
  </head>
  <body style="background:#151310"></body>
</html>
