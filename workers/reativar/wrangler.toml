name = "reativar"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets — OPCIONAIS (sem eles o endpoint responde 503 "not_configured",
# nunca lança/500). Setar via:
#   cd workers/reativar && npx wrangler secret put BEEHIIV_API_KEY
#   cd workers/reativar && npx wrangler secret put BEEHIIV_PUBLICATION_ID
# Mesmo valor de BEEHIIV_API_KEY já usado pelos scripts do repo
# (scripts/lib/beehiiv-config.ts) — publicationId é o mesmo de
# platform.config.json → beehiiv.publicationId.
#
# BEEHIIV_ORIGEM_ORIGINAL_FIELD — OPCIONAL, GATE (#5231/#5842). Sem ele, o
# CREATE de reativação NUNCA grava o custom field `origem_original` — o
# comportamento de hoje (sem preservação in-band), mesmo que o GET
# by_email traga a origem. Setar SÓ DEPOIS de criar o custom field
# `origem_original` na Beehiiv (dashboard/MCP), com o mesmo nome como valor
# (`ORIGEM_ORIGINAL_FIELD_NAME`, `scripts/lib/shared/beehiiv-origem-original.ts`):
#   cd workers/reativar && npx wrangler secret put BEEHIIV_ORIGEM_ORIGINAL_FIELD
# A mesma variável precisa estar setada no `.env` do Node pro
# `evaluate-brevo-diaria.ts` (via score) — ver `.env.example`. As duas
# pontas precisam estar ligadas pro #5842 (apuração preferindo
# `origem_original`) ter efeito prático: sem o gate, não há campo pra ler.
#
# BREVO_DIARIA_API_KEY — OPCIONAL (#4538 item B). Sem ela, o guard de
# descadastro nativo pendente é pulado (fail-open — ver src/index.ts),
# comportamento idêntico ao pré-#4538. Mesmo valor do env var apontado por
# platform.config.json → brevo_diaria.api_key_env (BREVO_DIARIA_API_KEY):
#   cd workers/reativar && npx wrangler secret put BREVO_DIARIA_API_KEY
# AÇÃO PENDENTE DO EDITOR — não armada nesta unidade (worktree isolado, sem
# Cloudflare/Brevo credentials ao vivo, mesmo padrão dos #4320/#4382).
#
# BREVO_DIARIA_LIST_ID — OPCIONAL (#4535). List id Brevo do canal
# `brevo_diaria` (mesmo valor de platform.config.json → brevo_diaria.list_id,
# hoje 7) — usado só pra desvincular da lista Brevo logo no clique
# (`unlinkReativarFromBrevoList`, src/index.ts). Sem ele (ou sem
# BREVO_DIARIA_API_KEY), o unlink é pulado com log estruturado — a varredura
# diária (evaluate-brevo-diaria.ts, #4534) continua sendo a rede de segurança:
#   cd workers/reativar && npx wrangler secret put BREVO_DIARIA_LIST_ID
# AÇÃO PENDENTE DO EDITOR — mesmo padrão dos #4320/#4382/#4490/#4534.

# REATIVAR_ALARM — binding KV OPCIONAL (#4551), NÃO declarado aqui de
# propósito (mesmo racional de `SUBSCRIBERS_KV` em workers/poll/wrangler.toml
# #3399/#4054: um `[[kv_namespaces]]` com id placeholder quebraria
# `wrangler deploy` antes do namespace existir de verdade). Sem o binding,
# `incrementReativarAlarmCounter` (scripts/lib/shared/reativar-alarm-counters.ts)
# é NO-OP fail-soft — o guard de descadastro nativo continua funcionando
# normalmente, só sem os contadores de alarme. Pra ativar:
#   1. wrangler kv namespace create REATIVAR_ALARM
#   2. Adicionar aqui:
#        [[kv_namespaces]]
#        binding = "REATIVAR_ALARM"
#        id = "<id retornado pelo passo 1>"
#   3. Implementar e agendar um leitor de alarme (mesmo papel de
#      scripts/cursos-error-alarm.ts) — NÃO implementado nesta unidade, ver
#      issue #4551 (só o mecanismo de contagem entrou no PR).
# AÇÃO PENDENTE DO EDITOR — mesmo padrão dos #4320/#4382/#4490/#4534.

[vars]
# #6048 (item 2/5 do checklist de migração Kit) — nome do custom field Kit
# que recebe o marcador "entrou pelo funil" (KIT_NATIVE_SIGNUP_MARKER, ver
# scripts/lib/shared/kit-signup-origin.ts). VAR, não secret — nome de custom
# field não é sensível (mesmo tratamento dos demais KIT_*_FIELD, ver
# workers/poll/SECRETS.md). Custom field já existe na conta Kit de produção
# (id 1348066). Ativo neste worker desde SUBSCRIBE_BACKEND = "kit" abaixo
# (#6048 item 4/5).
KIT_ORIGEM_CADASTRO_FIELD = "origem_cadastro"

# #6048 (item 4/5, Gate B aprovado pelo editor 25/08/2026 — rollout worker-a-
# worker, poll e cursos já verificados ao vivo, reativar é o 3º e último).
# env.SUBSCRIBE_BACKEND === "kit" em workers/reativar/src/index.ts — reativação
# passa a ir pro Kit em vez da Beehiiv.
SUBSCRIBE_BACKEND = "kit"
