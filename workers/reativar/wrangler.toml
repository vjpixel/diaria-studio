name = "reativar"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets — OPCIONAIS (sem eles o endpoint responde 503 "not_configured",
# nunca lança/500). Setar via:
#   cd workers/reativar && npx wrangler secret put BEEHIIV_API_KEY
#   cd workers/reativar && npx wrangler secret put BEEHIIV_PUBLICATION_ID
# Mesmo valor de BEEHIIV_API_KEY já usado pelos scripts do repo
# (scripts/lib/beehiiv-config.ts) — publicationId é o mesmo de
# platform.config.json → beehiiv.publicationId.
#
# BREVO_DIARIA_API_KEY — OPCIONAL (#4538 item B). Sem ela, o guard de
# descadastro nativo pendente é pulado (fail-open — ver src/index.ts),
# comportamento idêntico ao pré-#4538. Mesmo valor do env var apontado por
# platform.config.json → brevo_diaria.api_key_env (BREVO_DIARIA_API_KEY):
#   cd workers/reativar && npx wrangler secret put BREVO_DIARIA_API_KEY
# AÇÃO PENDENTE DO EDITOR — não armada nesta unidade (worktree isolado, sem
# Cloudflare/Brevo credentials ao vivo, mesmo padrão dos #4320/#4382).

# REATIVAR_ALARM — binding KV OPCIONAL (#4551), NÃO declarado aqui de
# propósito (mesmo racional de `SUBSCRIBERS_KV` em workers/poll/wrangler.toml
# #3399/#4054: um `[[kv_namespaces]]` com id placeholder quebraria
# `wrangler deploy` antes do namespace existir de verdade). Sem o binding,
# `incrementReativarAlarmCounter` (scripts/lib/shared/reativar-alarm-counters.ts)
# é NO-OP fail-soft — o guard de descadastro nativo continua funcionando
# normalmente, só sem os contadores de alarme. Pra ativar:
#   1. wrangler kv namespace create REATIVAR_ALARM
#   2. Adicionar aqui:
#        [[kv_namespaces]]
#        binding = "REATIVAR_ALARM"
#        id = "<id retornado pelo passo 1>"
#   3. Implementar e agendar um leitor de alarme (mesmo papel de
#      scripts/cursos-error-alarm.ts) — NÃO implementado nesta unidade, ver
#      issue #4551 (só o mecanismo de contagem entrou no PR).
# AÇÃO PENDENTE DO EDITOR — mesmo padrão dos #4320/#4382/#4490/#4534.
