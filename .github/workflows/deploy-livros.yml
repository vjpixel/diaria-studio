name: Deploy livros Worker

# #4084: workers/livros não tinha deploy automático. O 3º gap idêntico
# (depois de #3399 e #3268) — o PR #4070 (#4051, CTA de assinatura na página
# de livros) mergeou em master 260727 01:53 mas `livros.diar.ia.br` seguiu
# servindo a versão antiga até um `wrangler deploy` manual ad-hoc. Este
# workflow fecha esse gap: dispara `wrangler deploy` automaticamente sempre
# que um push em master tocar `workers/livros/**`. Padrão seguido:
# deploy-poll.yml (#3399, o mais recente dos 2 workflows de deploy que já
# existiam no repo).
#
# workers/livros era um worker de static assets sem package.json próprio
# (deploy manual documentado no README como `npx wrangler deploy`, sem
# `npm ci` — nada pra instalar). #4084 adicionou um package.json +
# package-lock.json mínimos (wrangler ^4.100.0, mesma versão já pinada em
# linkedin-cron/package-lock.json — a mais recente compatível com
# @cloudflare/workers-types@4.x; wrangler >=4.101 já exige workers-types@5.x
# via peerOptional, o que quebraria `npm ci` num lockfile fresco) só pra
# viabilizar este workflow no mesmo padrão dos outros 8 workers.
#
# Secrets reusados (mesmos do deploy-poll.yml/deploy-brevo-dashboard.yml):
# CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_WORKERS_TOKEN.
#
# #5703: depois do deploy, pinga o IndexNow (protocolo aberto — Google NÃO
# participa, só Bing/Yandex/Seznam) SE o push mudou `workers/livros/public/index.html`
# (única saída de `scripts/build-livros-page.ts` — o acervo de livros não tem
# hubs/slugs, é 1 página só) — mesmo racional/padrão de `deploy-arquivo.yml`
# (#4909 item 2) e `deploy-cursos.yml` (irmã desta mudança), generalizado via
# `--host`/`--watch-prefix` (`scripts/ping-indexnow.ts`, modo "página
# única"). Requer o secret `INDEXNOW_KEY` PROVISIONADO NESTE WORKER
# (`wrangler secret put INDEXNOW_KEY --name livros`) — sem ele, `GET
# /{key}.txt` não existe (ver `workers/livros/src/index.ts`
# `Env.INDEXNOW_KEY`) e o ping falharia na checagem do arquivo de chave; o
# secret de REPO `INDEXNOW_KEY` (usado abaixo pro valor da chave em si) já
# existe desde #4909, mas isso não configura o Worker sozinho — são dois
# provisionamentos distintos (ver PR body do #5703 pro estado confirmado).

on:
  push:
    branches: [master]
    paths:
      - 'workers/livros/**'
  workflow_dispatch:

concurrency:
  group: deploy-livros
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # #5703: precisa do commit ANTERIOR ao push localmente pra `git
          # diff --name-only ${{ github.event.before }} ${{ github.sha }}`
          # funcionar no step de detecção abaixo (mesmo padrão de
          # deploy-arquivo.yml/deploy-cursos.yml) — fetch-depth 1 (default)
          # só traz o HEAD.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install livros worker deps
        working-directory: workers/livros
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: workers/livros
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Detect changed livros content files
        id: livros-diff
        # Mesmo racional/estrutura de detecção de deploy-arquivo.yml/
        # deploy-cursos.yml (#5006): `git diff` pode FALHAR (não só dar
        # vazio) quando o push tem mais de 1 commit — `fetch-depth: 2` só
        # traz HEAD + 1 pai. `set +e` isola o exit code do `git diff` do
        # `set -e` do shell pra distinguir "o comando falhou" (warning
        # explícito) de "o comando rodou e deu vazio". workflow_dispatch não
        # tem `github.event.before` — gate fecha, ping não roda.
        run: |
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ]; then
            set +e
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'workers/livros/public/index.html')
            DIFF_EXIT=$?
            set -e
            if [ "$DIFF_EXIT" -ne 0 ]; then
              echo "::warning::git diff $BEFORE..${{ github.sha }} falhou (exit $DIFF_EXIT) -- provavelmente $BEFORE está fora do histórico raso (fetch-depth: 2, push com mais de 1 commit). Tratando como 'nenhum conteúdo mudou' por segurança -- o IndexNow pode ter sido pulado incorretamente neste push, confira manualmente."
              CHANGED=""
            fi
          else
            echo "::notice::sem commit anterior utilizável (workflow_dispatch, ou push sem github.event.before) -- pulando diff; IndexNow não será pingado nesta execução."
          fi
          {
            echo "changed<<INDEXNOW_EOF"
            echo "$CHANGED"
            echo "INDEXNOW_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow (só quando o acervo de livros mudou)
        if: steps.livros-diff.outputs.changed != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CHANGED_CONTENT_FILES: ${{ steps.livros-diff.outputs.changed }}
        run: |
          printf '%s\n' "$CHANGED_CONTENT_FILES" > "$RUNNER_TEMP/changed-livros-files.txt"
          npx tsx scripts/ping-indexnow.ts \
            --changed-files-file "$RUNNER_TEMP/changed-livros-files.txt" \
            --host livros.diar.ia.br \
            --watch-prefix workers/livros/public/index.html
