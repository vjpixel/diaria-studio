name: Deploy diaria-dashboard Worker

# #4084: workers/diaria-dashboard não tinha deploy automático — mesmo gap
# fechado pra workers/livros e workers/poll (#3399, #3268) no mesmo lote.
# Este workflow dispara `wrangler deploy` automaticamente sempre que um push
# em master tocar `workers/diaria-dashboard/**`. Padrão seguido:
# deploy-poll.yml (o mais recente dos 2 workflows de deploy que já existiam
# no repo) — inclusive o `npm ci` na raiz, necessário pro `[build] command`
# do wrangler.toml (`npx tsx ../../scripts/generate-worker-tokens.ts`, que
# resolve `tsx` a partir do node_modules da raiz — mesmo padrão do
# deploy-brevo-dashboard.yml).
#
# workers/diaria-dashboard tinha package.json mas SEM `wrangler` como
# devDependency e SEM script `deploy` (só tinha `typecheck`) — deploy sempre
# foi manual via `npx wrangler deploy` direto, sem lockfile reprodutível.
# #4084 adicionou `wrangler`/`deploy`/`dev` ao package.json e gerou o
# package-lock.json, pinando wrangler em 4.100.0 (mesma versão já usada em
# linkedin-cron/package-lock.json) em vez do range `^4.0.0` resolver pra
# latest (4.114 no momento deste PR): wrangler >=4.101 exige
# @cloudflare/workers-types@5.x via peerOptional, o que quebra `npm ci` num
# lockfile gerado do zero.
#
# Secrets reusados (mesmos do deploy-poll.yml/deploy-brevo-dashboard.yml):
# CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_WORKERS_TOKEN.

on:
  push:
    branches: [master]
    paths:
      - 'workers/diaria-dashboard/**'
  workflow_dispatch:

concurrency:
  group: deploy-diaria-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # #7117: workers/ virou npm workspace — este npm ci na RAIZ já instala
      # (e hoista) as deps de TODOS os workers, incluindo wrangler; o passo
      # separado "Install diaria-dashboard worker deps" (npm ci dentro de workers/diaria-dashboard)
      # foi removido porque não existe mais lockfile por worker pra ele rodar
      # contra. `npm run deploy` abaixo acha o `wrangler` hoistado via PATH
      # (node_modules/.bin da raiz, resolução padrão do npm em ancestrais).
      - run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: workers/diaria-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
