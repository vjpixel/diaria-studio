name: Deploy anual Worker

# #7620: workers/anual (mergeado pelos #7581/#7616) nunca ganhou deploy
# automático — mesma classe de gap já fechada 3x (#3268 brevo-dashboard,
# #3399 poll, #5337 reativar). Este workflow fecha o gap: dispara
# `wrangler deploy` automaticamente sempre que um push em master tocar
# `workers/anual/**` — mesmo molde de deploy-poll.yml/deploy-reativar.yml.
#
# Secrets reusados (mesmos dos outros deploy-*.yml): CLOUDFLARE_ACCOUNT_ID e
# CLOUDFLARE_WORKERS_TOKEN.

on:
  push:
    branches: [master]
    paths:
      - 'workers/anual/**'
  workflow_dispatch:

concurrency:
  group: deploy-anual
  cancel-in-progress: false

jobs:
  # #7118: bloco de steps extraído para .github/workflows/deploy-worker.yml
  # (workflow_call) — 8 dos 12 deploy-*.yml eram byte-idênticos além do
  # nome do worker. Ver comentário de topo de deploy-worker.yml para a
  # justificativa (por que workflow_call aqui e não o padrão de ci.yml).
  deploy:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      worker: anual
    secrets: inherit
