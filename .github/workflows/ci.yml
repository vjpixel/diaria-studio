name: CI

on:
  push:
    branches: [master]
    # #6711 — mesmo paths-ignore do bloco pull_request: abaixo, replicado
    # aqui. Achado ao vivo (comentário da issue): um PR docs-only que já
    # pulou a suíte no lado pull_request: ainda pagava a suíte inteira de
    # novo no push:master do squash-merge — 100% do custo sem nenhum sinal
    # novo, porque o diff nunca foi coberto por ela em nenhum dos dois lados.
    # Decisão do editor (#6711, 30/08/2026, via /diaria-desbloqueia): aceitar
    # não rodar a suíte em merges docs-only também no master. Manter os dois
    # blocos em sincronia manualmente — não há include compartilhado nativo
    # do GitHub Actions entre triggers de um mesmo workflow (`test/ci-workflow-paths-ignore.test.ts`
    # trava a sincronia). Se um required status check aplicado a PUSH (ruleset
    # de branch, distinto do gate de merge de PR) for adicionado ao `master`
    # um dia, revisitar este bloco também — mesma ressalva do comentário do
    # bloco pull_request: abaixo.
    paths-ignore:
      - "CLAUDE.md"
      - "**/*.md"
      - "docs/**"
      - "**/.claude/skills/**"
      - "**/*.mdx"
  pull_request:
    # #5901 — diffs que não tocam código executável não pagam a suite (~7min):
    # o PR docs-only médio cai de ~7min pra segundos. pr-checks.yml (gates
    # rápidos ~30s, incl. regression gate) continua rodando em TODO PR — os
    # guards que importam em docs-only permanecem. Se um required check
    # nomeado for adicionado ao ruleset do master um dia, revisitar (padrão
    # GitHub: workflow espelho no-op com o mesmo nome de job).
    paths-ignore:
      - "CLAUDE.md"
      - "**/*.md"
      - "docs/**"
      - "**/.claude/skills/**"
      - "**/*.mdx"

concurrency:
  # #6835: dois regimes distintos por trigger, não um grupo único.
  #
  # push:master NUNCA cancela — grupo único por SHA (`github.sha`). Antes,
  # o grupo era `ci-${{ github.ref }}`, que pra push é sempre a MESMA string
  # (`refs/heads/master`) — qualquer 2 merges mais rápidos que a suíte
  # (~5-9min) cancelavam o run do commit anterior. Levantamento retroativo do
  # #6822 mediu 37 merges recentes cujo job `test` do próprio SHA mergeado
  # nunca completou (`cancelled`, sem retry) — essa árvore específica de
  # master nunca recebeu NENHUM resultado de CI, nem verde nem vermelho.
  # `cancel-in-progress: false` aqui é redundante por construção (grupo já
  # único por SHA nunca colide), mantido explícito documentando a intenção.
  #
  # pull_request continua cancelando — grupo por `github.ref`, que pra
  # pull_request já é único POR PR (`refs/pull/N/merge`), então isso nunca
  # colidiu entre PRs diferentes. O cancelamento aqui é o caso legítimo:
  # um push novo na MESMA PR (evento `synchronize`) cancela o run do commit
  # anterior dessa PR — é o mesmo diff em evolução, economia sem perda de
  # sinal (o commit anterior nunca ficou em master, não precisa de resultado
  # próprio).
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (#6413) — worker-drift-check-script.test.ts precisa de
      # origin/master resolvível localmente (getLastCommitAt/resolveProductionRef
      # comparam sempre contra a ref de produção, nunca a branch checked out —
      # o default fetch-depth:1 do actions/checkout só traz o commit único do PR,
      # sem nenhuma ref de master). Mesmo padrão já usado pelos jobs de
      # pr-checks.yml que precisam de histórico git real (regression-test-gate,
      # seed-html-sync).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - name: Install brevo-dashboard worker deps
        working-directory: workers/brevo-dashboard
        run: npm ci
      - name: Typecheck brevo-dashboard worker (#3164)
        working-directory: workers/brevo-dashboard
        run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npm run smoke
      - name: Validate RSS feeds
        run: npm run validate-feeds
        continue-on-error: true
