name: CI

on:
  push:
    branches: [master]
    # #6711 — mesmo paths-ignore do bloco pull_request: abaixo, replicado
    # aqui. Achado ao vivo (comentário da issue): um PR docs-only que já
    # pulou a suíte no lado pull_request: ainda pagava a suíte inteira de
    # novo no push:master do squash-merge — 100% do custo sem nenhum sinal
    # novo, porque o diff nunca foi coberto por ela em nenhum dos dois lados.
    # Decisão do editor (#6711, 30/08/2026, via /diaria-desbloqueia): aceitar
    # não rodar a suíte em merges docs-only também no master. Manter os dois
    # blocos em sincronia manualmente — não há include compartilhado nativo
    # do GitHub Actions entre triggers de um mesmo workflow.
    paths-ignore:
      - "CLAUDE.md"
      - "**/*.md"
      - "docs/**"
      - "**/.claude/skills/**"
      - "**/*.mdx"
  pull_request:
    # #5901 — diffs que não tocam código executável não pagam a suite (~7min):
    # o PR docs-only médio cai de ~7min pra segundos. pr-checks.yml (gates
    # rápidos ~30s, incl. regression gate) continua rodando em TODO PR — os
    # guards que importam em docs-only permanecem. Se um required check
    # nomeado for adicionado ao ruleset do master um dia, revisitar (padrão
    # GitHub: workflow espelho no-op com o mesmo nome de job).
    paths-ignore:
      - "CLAUDE.md"
      - "**/*.md"
      - "docs/**"
      - "**/.claude/skills/**"
      - "**/*.mdx"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (#6413) — worker-drift-check-script.test.ts precisa de
      # origin/master resolvível localmente (getLastCommitAt/resolveProductionRef
      # comparam sempre contra a ref de produção, nunca a branch checked out —
      # o default fetch-depth:1 do actions/checkout só traz o commit único do PR,
      # sem nenhuma ref de master). Mesmo padrão já usado pelos jobs de
      # pr-checks.yml que precisam de histórico git real (regression-test-gate,
      # seed-html-sync).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - name: Install brevo-dashboard worker deps
        working-directory: workers/brevo-dashboard
        run: npm ci
      - name: Typecheck brevo-dashboard worker (#3164)
        working-directory: workers/brevo-dashboard
        run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npm run smoke
      - name: Validate RSS feeds
        run: npm run validate-feeds
        continue-on-error: true
