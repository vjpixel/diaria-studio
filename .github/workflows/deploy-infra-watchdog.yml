name: Deploy infra-watchdog Worker

# #12981: deployment stays gated by INFRA_300_WATCHDOG_DEPLOY_ENABLED (true since
# 25/11/2026). The cron is declared in wrangler.toml, so every deploy arms it.
# See docs/infra-300-watchdog.md.
on:
  push:
    branches: [master]
    paths:
      - 'workers/infra-watchdog/**'
      - '.github/workflows/deploy-infra-watchdog.yml'
  workflow_dispatch:

concurrency:
  group: deploy-infra-watchdog
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.INFRA_300_WATCHDOG_DEPLOY_ENABLED == 'true' }}
    uses: ./.github/workflows/deploy-worker.yml
    with:
      worker: infra-watchdog
    secrets: inherit
