name: Weekly Bug Heatmap

# #1014: regenera docs/bug-heatmap.md toda 6ª feira (após weekly-e2e)
# e commita se houver mudanças.

on:
  schedule:
    # Toda 6ª às 10h UTC = 7h BRT (1h após weekly-e2e às 9h UTC)
    - cron: '0 10 * * 5'
  workflow_dispatch:

# #8483: evita baixar o Chrome do puppeteer em `npm ci` — nenhum job
# deste workflow usa o browser real (scripts que precisam dele, como
# capture-livros-promo.ts/verify-accessibility.ts, rodam fora do CI).
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

# #8489: com o merge automático abaixo, 2 runs sobrepostos (cron + um
# workflow_dispatch manual perto do horário) disputariam a MESMA PR e o
# mesmo branch fixo `bot/heatmap-weekly-regen`.
concurrency:
  group: weekly-bug-heatmap
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pra criar branch + commit
      issues: read
      pull-requests: write # Pra abrir PR
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Regenerate heatmap
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/bug-heatmap.ts --out docs/bug-heatmap.md

      # #1465: branch protection bloqueia push direto pra master — abrimos PR.
      - name: Open PR if changed
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(heatmap): weekly regen (#1014)"
          title: "chore(heatmap): weekly regen ${{ github.run_id }}"
          body: |
            Regen automático semanal do `docs/bug-heatmap.md` (#1014).

            Mergeada automaticamente pelo próprio workflow assim que os checks
            passarem (#8489). Workflow não falha mais se não houver mudanças
            (ver #1465).
          branch: bot/heatmap-weekly-regen
          delete-branch: true
          add-paths: docs/bug-heatmap.md
          author: "diaria-bot <diaria-bot@noreply.github.com>"
          committer: "diaria-bot <diaria-bot@noreply.github.com>"

      # #8489: sem este passo a PR fica aberta indefinidamente — PR de bot é
      # exceção da regra "1 PR aberto por vez" e overnight/develop trabalham
      # fila de issues, então nada a drena. Não dá pra usar `gh pr merge
      # --auto`: a ruleset de master não exige status check nenhum, e o
      # auto-merge mergearia na hora, antes do "PR Checks" rodar. O --watch
      # abaixo segura o job até os checks fecharem e falha se algum quebrar.
      # #8883: a PR é aberta com `secrets.GITHUB_TOKEN` — por regra
      # anti-recursão do GitHub, eventos gerados por esse token NUNCA
      # disparam outro workflow, então `pull_request` nunca roda pra essa PR
      # e nenhum check chega a existir. Ausência de check != check vermelho:
      # a ruleset "Protect main branch" não exige status check nenhum pra
      # merge (só passar por PR — `gh api repos/.../rulesets/16308778`,
      # confirmado 28/09/2026), então esperar indefinidamente por um check
      # que nunca nasce é autoimposto, não exigido pelo GitHub. O teto de
      # 3min abaixo ainda dá chance a um check que EVENTUALMENTE apareça
      # (ex: alguém rodou workflow_dispatch manual enquanto isso) — só nesse
      # caso o --watch de antes continua valendo; sem nenhum check, mergeia
      # direto (conteúdo gerado, docs/bug-heatmap.md, baixo risco).
      - name: Merge quando os checks passarem
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # `gh pr view` falhando é blip de API — trata como "sem check
          # ainda" e segue tentando, não aborta a rodada.
          n=0
          for _ in $(seq 1 18); do
            n=$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup | length' 2>/dev/null || echo "0")
            [ "${n:-0}" -gt 0 ] && break
            n=0
            sleep 10
          done

          if [ "$n" -eq 0 ]; then
            echo "::warning::Nenhum check apareceu em 3min (esperado — GITHUB_TOKEN não dispara pull_request, #8883). Mergeando sem CI: o ruleset de master não exige status check."
          else
            # Checks apareceram (caminho não-default, ex: workflow_dispatch
            # manual) — mesma disciplina de antes: os ~14 checks vêm de 5
            # workflows distintos e não se registram no mesmo instante, então
            # o --watch roda até a CONTAGEM estabilizar entre duas rodadas, e
            # falha se algum check vier vermelho.
            prev=""
            for _ in $(seq 1 20); do
              gh pr checks "$PR" --watch --fail-fast
              n=$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup | length' 2>/dev/null || echo "")
              [ -n "$n" ] && [ "$n" = "$prev" ] && break
              prev=$n
              sleep 20
            done
          fi
          # Check vermelho aborta antes daqui pelo `bash -e` default: a PR
          # fica aberta de propósito.
          gh pr merge "$PR" --squash --delete-branch
