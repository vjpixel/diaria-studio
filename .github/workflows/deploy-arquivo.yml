name: Deploy arquivo Worker

# #4105: página de arquivo estática (todas as edições publicadas, `<a href>`
# reais pra indexação retroativa pelo Google — só 10.8%/24 de 223 edições
# estavam indexadas). Clona a estrutura de deploy-cursos.yml: dispara
# `wrangler deploy` automaticamente sempre que um push em master tocar
# `workers/arquivo/**`.
#
# Worker deliberadamente simples (sem KV, sem secrets) — reusa os mesmos 2
# secrets de repo já configurados pros outros workers (CLOUDFLARE_WORKERS_TOKEN,
# CLOUDFLARE_ACCOUNT_ID), nenhum secret novo necessário pro deploy em si.
#
# #4909 item 2: depois do deploy, pinga o IndexNow (protocolo aberto —
# Google NÃO participa, só Bing/Yandex/Seznam) SE o push mudou pelo menos um
# `workers/arquivo/src/hubs/*.generated.ts` — o mesmo sinal de "hub mudou de
# conteúdo" que já governa o `<lastmod>` do sitemap (#4909 item 1). Pingar
# uma URL que não mudou é o mesmo argumento de erosão de confiança citado
# pro `<lastmod>` — por isso o gate roda ANTES de invocar
# scripts/ping-indexnow.ts, não dentro dele (defesa em profundidade: o
# script também fecha sozinho se a lista recebida não tiver `.generated.ts`,
# mas o gate aqui evita nem montar/logar a lista à toa). Requer o secret
# `INDEXNOW_KEY` (gerado pelo editor em indexnow.org/documentation,
# provisionado aqui E como Worker var — ver Env.INDEXNOW_KEY em
# workers/arquivo/src/index.ts); sem o secret, o step roda e sai 0 sem
# pingar (`ping-indexnow.ts` trata chave ausente como gate fechado).

on:
  push:
    branches: [master]
    paths:
      - 'workers/arquivo/**'
  workflow_dispatch:

concurrency:
  group: deploy-arquivo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # #4909 item 2: precisa do commit ANTERIOR ao push localmente pra
          # `git diff --name-only ${{ github.event.before }} ${{ github.sha }}`
          # funcionar no step de detecção abaixo — fetch-depth 1 (default)
          # só traz o HEAD.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install arquivo worker deps
        working-directory: workers/arquivo
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: workers/arquivo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Detect changed hub .generated.ts files
        id: hub-diff
        # workflow_dispatch não tem github.event.before (evento manual, sem
        # "push anterior") — gate fecha e o step de ping seguinte não roda
        # (condição abaixo checa outputs.changed != ''). Push com before
        # zerado (ex: branch novo — nunca acontece em push pra master, mas
        # defensivo) trata do mesmo jeito.
        #
        # #5006: `git diff` pode FALHAR (não só "dar vazio") quando o push
        # tem mais de 1 commit — `fetch-depth: 2` só traz HEAD + 1 pai, então
        # $BEFORE cai fora do histórico raso local nesse caso. O exit code do
        # `git diff` é capturado SEPARADO da atribuição (`set +e` em volta,
        # não `|| true` colado no comando) justamente pra distinguir "o
        # comando falhou" (log explícito via `::warning::`, silenciosamente
        # tratado como CHANGED="" antes disso) de "o comando rodou e o diff
        # deu vazio" (nenhum log, comportamento normal) — o job continua
        # verde nos dois casos (o ping do IndexNow é best-effort, não deve
        # reprovar o deploy), mas agora o run log distingue os dois motivos.
        run: |
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ]; then
            set +e
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'workers/arquivo/src/hubs/*.generated.ts')
            DIFF_EXIT=$?
            set -e
            if [ "$DIFF_EXIT" -ne 0 ]; then
              echo "::warning::git diff $BEFORE..${{ github.sha }} falhou (exit $DIFF_EXIT) -- provavelmente $BEFORE está fora do histórico raso (fetch-depth: 2, push com mais de 1 commit). Tratando como 'nenhum hub mudou' por segurança -- o IndexNow pode ter sido pulado incorretamente neste push, confira manualmente se algum workers/arquivo/src/hubs/*.generated.ts mudou."
              CHANGED=""
            fi
          else
            echo "::notice::sem commit anterior utilizável (workflow_dispatch, ou push sem github.event.before) -- pulando diff de hubs; IndexNow não será pingado nesta execução."
          fi
          {
            echo "changed<<INDEXNOW_EOF"
            echo "$CHANGED"
            echo "INDEXNOW_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow (só quando um hub .generated.ts mudou)
        if: steps.hub-diff.outputs.changed != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          # Indireção via env (não interpolar ${{ }} direto no corpo do
          # `run:`) — mesma prática recomendada pelo GitHub pra evitar que
          # o valor do output vire texto de script; aqui o conteúdo é só
          # path de arquivo do nosso próprio diff, sem risco real, mas o
          # padrão é gratuito e evita reabrir a discussão depois.
          CHANGED_HUB_FILES: ${{ steps.hub-diff.outputs.changed }}
        run: |
          printf '%s\n' "$CHANGED_HUB_FILES" > "$RUNNER_TEMP/changed-hub-files.txt"
          npx tsx scripts/ping-indexnow.ts --changed-files-file "$RUNNER_TEMP/changed-hub-files.txt"
