name: PR Checks (#970)

# Guards adicionais pra PRs que CI principal não cobre:
# 1. check-invariants --static: regras estruturais do repo (ex: drive-sync nunca push _internal/_forensic, #959)
# 2. Regression test gate: PR de bugfix exige teste novo (ou label `no-regression-test` + justificativa)
# 3. Seed/HTML sync: seed de página estática (cursos/livros) mudou sem o HTML
#    gerado correspondente no mesmo PR — sinal de que o build step não rodou (#3105)
# 4. Hub page drift: scripts/lib/hubs/*.ts editado sem regenerar o
#    workers/arquivo/src/hubs/*.generated.ts correspondente. Roda isolado do
#    job `test` completo (~5min) do ci.yml pra pegar o drift em segundos
#    (#4897 — o padrão pegou o CI de surpresa 3x na mesma sessão develop).
# 5. Typecheck ratchet: tsc -p tsconfig.test.json --noEmit (scripts/** +
#    test/**, diferente do tsconfig.json raiz do ci.yml que só cobre
#    scripts/**) contra baseline committed (tsc-baseline.json) — só reprova
#    erro de tipo NOVO, nunca os ~1.062 pré-existentes (#6217).
# 6. One-off script validity: script NOVO em scripts/ (nível raiz) cujo nome
#    bate analyze-*/diagnose-*/probe-*/measure-*/compare-* precisa declarar
#    `@one-off-validity` (expira=AAAA-MM-DD ou permanente) — o padrão que
#    gerou 17 órfãos em 4 meses (#7114). Só arquivo NOVO, nunca existente.
# 7. PR removal declaration: PR que adiciona mais que o limiar de linhas
#    precisa declarar `removal-declaration: <...>` no body — o que remove,
#    ou por que legitimamente não remove nada (#7115).
# 8. Validate agents: frontmatter YAML de .claude/agents/*.md e
#    .claude/skills/*/SKILL.md parseia limpo + nenhum mcp__<server>__<tool>
#    fora de KNOWN_MCP_PREFIXES (#122, #7279/#7290). Mora aqui e não em
#    ci.yml de propósito — ci.yml ignora diff só-de-.md (paths-ignore acima),
#    e agente/skill É markdown; ligar só em ci.yml deixaria todo PR que só
#    toca frontmatter de agent sem nenhum guard rodando (#7299).
#
# Não substitui ci.yml — roda em paralelo com escopo focado.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unused-code-check:
    name: Unused code check (knip, #1008)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run knip
        run: npx knip --no-progress --reporter compact

  invariants-static:
    name: Static invariants check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run check-invariants --static
        run: npx tsx scripts/check-invariants.ts --static

  regression-test-gate:
    name: Regression test gate (PR de bugfix exige teste novo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Detect bugfix + verify regression test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx tsx scripts/check-pr-bugfix.ts

  seed-html-sync:
    name: Seed/HTML sync (cursos/livros, #3105)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Detect seed changed without corresponding built HTML
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx tsx scripts/check-seed-html-sync.ts

  one-off-script-validity:
    name: One-off script validity (#7114)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Detect new one-off script without declared validity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx tsx scripts/check-one-off-script-validity.ts

  pr-removal-declaration:
    name: PR removal declaration (#7115)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Detect large-addition PR without removal declaration
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx tsx scripts/check-pr-removal-declaration.ts

  hub-page-drift:
    name: Hub page drift (workers/arquivo/src/hubs, #4897)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run test/hub-page-drift.test.ts
        run: npx tsx --test test/hub-page-drift.test.ts

  typecheck-ratchet:
    # #6217 — tsconfig.json raiz (npm run typecheck, ci.yml) só cobre
    # scripts/**, deixando todo guard de tipo escrito em test/** decorativo.
    # Este check liga tsconfig.test.json (scripts/** + test/**) sem
    # reprovar o master pelos erros pré-existentes (~1.062 na baseline
    # inicial) — só falha quando aparece um erro NOVO (arquivo+código sem
    # entry em tsc-baseline.json, ou mais ocorrências de um erro já
    # conhecido). Ver scripts/lib/tsc-baseline.ts pro contrato exato e
    # scripts/typecheck-ratchet.ts pra como baixar a baseline.
    name: Typecheck ratchet (test/**, #6217)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run typecheck-ratchet
        run: npx tsx scripts/typecheck-ratchet.ts

  validate-agents:
    # #7299 — `npm run validate-agents` (scripts/validate-agent-frontmatter.ts,
    # #122 + guard de MCP tool name do #7290/#7279) existia só em disco: nada
    # chamava. Roda aqui, não em ci.yml — ci.yml tem paths-ignore pra
    # `**/*.md`/`**/.claude/skills/**` (mesmo bloco em push: e pull_request:),
    # e agent/skill SÃO .md — um PR que só edita frontmatter de agent (ex: o
    # incidente do PR #7301) nunca dispararia ci.yml. pr-checks.yml não tem
    # paths-ignore, roda em todo PR.
    name: Validate agents (frontmatter YAML + MCP tool names, #122/#7279)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run validate-agents
        run: npm run validate-agents

  shell-tests:
    # #7129 item (c) — os `*.test.sh` do repo não rodavam em lugar nenhum:
    # `scripts/run-tests.ts` varre só `*.test.ts` e nenhum step os invocava.
    # Eram 12 arquivos (a issue contava 5, olhando só `test/`), todos passando
    # — cobertura real que existia e não valia nada, justamente sobre
    # `hermes/` e o fluxo do contínuo, que é o consumidor externo no helios e
    # a área onde este repo já reverteu uma remoção (#6059/#6060).
    #
    # Aqui e não em ci.yml pelo mesmo motivo do `validate-agents` acima:
    # ci.yml tem `paths-ignore` e um PR que só mexa em shell/markdown poderia
    # não disparar. pr-checks.yml roda em todo PR.
    name: Shell tests (*.test.sh, #7129)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run scripts/run-shell-tests.ts
        run: npx tsx scripts/run-shell-tests.ts
