name: Deploy site Worker

# #467: workers/site serve o acervo /p/{slug} (258 edições) a partir do
# cache data/beehiiv-cache/posts/ — futuro candidato a servir o apex
# diar.ia.br (cutover ainda NÃO feito, ver docs/apex-cutover-rollback.md).
# Workflow no mesmo padrão de deploy-artigos.yml: dispara `wrangler deploy`
# sempre que um push em master tocar `workers/site/**`.
#
# Nota: as páginas HTML geradas (workers/site/public/p/**) são COMMITADAS
# — não geradas em CI. `scripts/gen-archive-pages.ts` roda localmente
# (precisa do cache data/beehiiv-cache/posts/, que é gitignored/OneDrive,
# indisponível no runner) e o resultado entra no PR como qualquer outro
# static asset. Rerodar o script + commitar public/p/ quando o cache for
# atualizado (beehiiv-sync.ts) e quiser refletir o acervo mais recente.
#
# Secrets reusados (mesmos do deploy-artigos.yml/deploy-poll.yml):
# CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_WORKERS_TOKEN.

on:
  push:
    branches: [master]
    paths:
      - 'workers/site/**'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # #7118: bloco de steps extraído para .github/workflows/deploy-worker.yml
  # (workflow_call) — 8 dos 12 deploy-*.yml eram byte-idênticos além do
  # nome do worker. Ver comentário de topo de deploy-worker.yml para a
  # justificativa (por que workflow_call aqui e não o padrão de ci.yml).
  deploy:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      worker: site
    secrets: inherit
