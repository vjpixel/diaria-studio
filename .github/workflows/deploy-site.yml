name: Deploy site Worker

# #467: workers/site serve o acervo /p/{slug} (270+ edições) e hoje é o
# apex diar.ia.br (cutover já feito, ver docs/apex-cutover-rollback.md).
# Workflow no mesmo padrão de deploy-arquivo.yml/deploy-cursos.yml/
# deploy-livros.yml: dispara `wrangler deploy` sempre que um push em master
# tocar `workers/site/**`.
#
# Nota: as páginas HTML geradas (workers/site/public/p/**) são COMMITADAS
# — não geradas em CI. `scripts/gen-archive-pages.ts` roda localmente
# (precisa do cache data/beehiiv-cache/posts/, que é gitignored/OneDrive,
# indisponível no runner) e o resultado entra no PR como qualquer outro
# static asset. Rerodar o script + commitar public/p/ quando o cache for
# atualizado (beehiiv-sync.ts) e quiser refletir o acervo mais recente.
#
# Secrets reusados (mesmos do deploy-artigos.yml/deploy-poll.yml):
# CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_WORKERS_TOKEN.
#
# #8355 (2 mudanças, mesmo padrão dos 3 workers-irmãos que já resolveram
# isto — arquivo #4909, cursos/livros #5703):
#
#   1. ETag fraco + Last-Modified + 304 condicional pras páginas do acervo
#      (`workers/site/src/index.ts`, `scripts/lib/shared/http-conditional.ts`)
#      — não muda este workflow, só o Worker.
#
#   2. Passou de `workflow_call` (deploy-worker.yml) pra STANDALONE — este
#      arquivo foi 1 dos 8 workers idênticos que só faziam checkout+deploy;
#      agora ganha pós-processamento próprio (IndexNow) igual arquivo/
#      cursos/livros, então sai da lista de callers do reusable (ver
#      comentário atualizado em deploy-worker.yml). Depois do deploy, pinga
#      o IndexNow (protocolo aberto — Google NÃO participa, só Bing/Yandex/
#      Seznam) SE o push mudou pelo menos um `workers/site/public/p/{slug}/
#      index.html` — o modo `--archive-pages` de `ping-indexnow.ts`
#      (`buildArchivePagesIndexNowPayload`), generalização do modo hub do
#      arquivo pra um host com MUITAS páginas individuais em vez de hubs
#      temáticos. Requer o secret `INDEXNOW_KEY` (mesmo secret de repo já
#      usado pelos outros 3 — ver `Env.INDEXNOW_KEY` em
#      `workers/site/src/index.ts`); sem o secret, o step roda e sai 0 sem
#      pingar.

on:
  push:
    branches: [master]
    paths:
      - 'workers/site/**'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

# #8483: evita baixar o Chrome do puppeteer em `npm ci` — nenhum job
# deste workflow usa o browser real (scripts que precisam dele, como
# capture-livros-promo.ts/verify-accessibility.ts, rodam fora do CI).
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # #8355: precisa do commit ANTERIOR ao push localmente pra `git
          # diff --name-only ${{ github.event.before }} ${{ github.sha }}`
          # funcionar no step de detecção abaixo (mesmo padrão de
          # deploy-arquivo.yml/deploy-cursos.yml/deploy-livros.yml) —
          # fetch-depth 1 (default) só traz o HEAD.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # #7117: workers/ é npm workspace — este npm ci na RAIZ já instala
      # (e hoista) as deps de TODOS os workers, incluindo wrangler.
      - run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: workers/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Detect changed archive pages (workers/site/public/p/{slug}/index.html)
        id: archive-diff
        # Mesmo racional/estrutura de detecção de deploy-arquivo.yml/
        # deploy-cursos.yml/deploy-livros.yml (#5006): `git diff` pode
        # FALHAR (não só dar vazio) quando o push tem mais de 1 commit —
        # `fetch-depth: 2` só traz HEAD + 1 pai. `set +e` isola o exit code
        # do `git diff` do `set -e` do shell pra distinguir "o comando
        # falhou" (warning explícito) de "o comando rodou e deu vazio"
        # (nenhum warning). workflow_dispatch não tem `github.event.before`
        # — gate fecha, ping não roda.
        run: |
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ]; then
            set +e
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'workers/site/public/p/*/index.html')
            DIFF_EXIT=$?
            set -e
            if [ "$DIFF_EXIT" -ne 0 ]; then
              echo "::warning::git diff $BEFORE..${{ github.sha }} falhou (exit $DIFF_EXIT) -- provavelmente $BEFORE está fora do histórico raso (fetch-depth: 2, push com mais de 1 commit). Tratando como 'nenhuma página mudou' por segurança -- o IndexNow pode ter sido pulado incorretamente neste push, confira manualmente."
              CHANGED=""
            fi
          else
            echo "::notice::sem commit anterior utilizável (workflow_dispatch, ou push sem github.event.before) -- pulando diff; IndexNow não será pingado nesta execução."
          fi
          {
            echo "changed<<INDEXNOW_EOF"
            echo "$CHANGED"
            echo "INDEXNOW_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow (só quando pelo menos 1 página do acervo mudou)
        if: steps.archive-diff.outputs.changed != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CHANGED_ARCHIVE_FILES: ${{ steps.archive-diff.outputs.changed }}
        run: |
          printf '%s\n' "$CHANGED_ARCHIVE_FILES" > "$RUNNER_TEMP/changed-archive-files.txt"
          npx tsx scripts/ping-indexnow.ts \
            --changed-files-file "$RUNNER_TEMP/changed-archive-files.txt" \
            --archive-pages
