name: Deploy draft Worker

# #4084: workers/draft não tinha deploy automático — mesmo gap fechado pra
# workers/livros e workers/poll (#3399, #3268) no mesmo lote. Este workflow
# dispara `wrangler deploy` automaticamente sempre que um push em master
# tocar `workers/draft/**`. Padrão seguido: deploy-poll.yml (o mais recente
# dos 2 workflows de deploy que já existiam no repo).
#
# Verificação pré-workflow (#4084): NÃO é protótipo — `workers/draft` hospeda
# preview HTML usado pelo fluxo de publicação real (`scripts/upload-html-public.ts`,
# `scripts/monthly-preview-cloudflare.ts`, `scripts/lib/beehiiv-insert-text.ts`,
# `context/publishers/beehiiv-playbook.md`, `platform.config.json`) e já tem
# KV namespace real (não placeholder) e secret ADMIN_SECRET configurados.
#
# Secrets reusados (mesmos do deploy-poll.yml/deploy-brevo-dashboard.yml):
# CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_WORKERS_TOKEN.

on:
  push:
    branches: [master]
    paths:
      - 'workers/draft/**'
  workflow_dispatch:

concurrency:
  group: deploy-draft
  cancel-in-progress: false

jobs:
  # #7118: bloco de steps extraído para .github/workflows/deploy-worker.yml
  # (workflow_call) — 8 dos 12 deploy-*.yml eram byte-idênticos além do
  # nome do worker. Ver comentário de topo de deploy-worker.yml para a
  # justificativa (por que workflow_call aqui e não o padrão de ci.yml).
  deploy:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      worker: draft
    secrets: inherit
